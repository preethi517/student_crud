server.port=${PORT:8080}

# Local defaults; Render/Docker override these with environment variables
spring.datasource.url=jdbc:postgresql://localhost:5432/preeti
spring.datasource.username=postgres
spring.datasource.password=pg123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Allowed frontend origins (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}